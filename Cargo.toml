[workspace]
resolver = "3"
members = [
    "crates/cveguard-proto",
    "crates/afterguard",
    "crates/afteralert",
    "crates/afterseal",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.97.1"
license = "UNLICENSED"

[workspace.dependencies]
cveguard-proto = { path = "crates/cveguard-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
subtle = "2.6.1"
getrandom = { version = "0.3.4", features = ["std"] }
hex = "0.4.3"
libc = "0.2.188"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
